<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- DeviDex browser / app icons. Everything in /public is served from '/'. -->
    <link rel="icon" href="/favicons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicons/site-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="/favicons/site.webmanifest" />
    <meta name="theme-color" content="#F4FFFD" />

    <!-- Self-hosted fonts (no third-party requests). Preloaded to avoid a flash. -->
    <link rel="preload" href="/fonts/atkinson-hyperlegible-next.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin />

    <meta
      name="description"
      content="DeviDex: track your Pokémon Living Dex box by box, including shinies, forms and every game's Pokédex."
    />
    <title>DeviDex</title>
  </head>
  <body>
    <!-- React mounts the entire app inside this element. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
